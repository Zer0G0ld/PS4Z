<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja PS4</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        h1 {
            color: #0070d1; /* Azul PlayStation */
            margin-bottom: 10px;
        }
        p {
            color: #aaaaaa;
            margin-bottom: 30px;
        }
        .game-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            margin: 15px auto;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .download-btn {
            background-color: #0070d1;
            color: white;
            padding: 12px 24px;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s;
            width: 80%;
            box-sizing: border-box;
        }
        .download-btn:hover, .download-btn:focus {
            background-color: #005bb5;
            outline: 2px solid white; /* Ajuda a ver onde o controle está no PS4 */
        }
    </style>
</head>
<body>

    <h1>Zer0 Loja PS4</h1>
    <p>Selecione um jogo para baixar</p>

    <h3>Funciona</h3>
    <div class="game-card">
        <div class="game-title">Bendy and The Dark Revival</div>
        <a href="https://huggingface.co/datasets/Zer0G0ld/ps4z/resolve/main/Bendy-and-The-Dark-Revival.pkg" class="download-btn" download target="_blank">Baixar Jogo</a>
    </div>

  <h3>Não funciona</h3>

    <!-- MODELO DE JOGO 1 -->
    <div class="game-card">
        <div class="game-title">Nome do Jogo 1 (Ex: God of War)</div>
        <!-- Troque "NOME_DO_ARQUIVO.pkg" pelo nome exato do seu arquivo -->
        <a href="NOME_DO_ARQUIVO.pkg" class="download-btn" download target="_blank">Baixar Jogo</a>
    </div>

    <!-- MODELO DE JOGO 2 -->
    <div class="game-card">
        <div class="game-title">Nome do Jogo 2 (Ex: Spider-Man)</div>
        <!-- Troque "OUTRO_JOGO.pkg" pelo nome exato do seu arquivo -->
        <a href="OUTRO_JOGO.pkg" class="download-btn" download target="_blank">Baixar Jogo</a>
    </div>

</body>
</html>
