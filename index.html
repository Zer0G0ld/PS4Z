<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zer0 Loja PS4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <!-- Botão de Desbloqueio adicionado aqui -->
        <div style="position: absolute; top: 20px; right: 20px;">
            <a href="jb.html" style="background: #e63946; color: white; padding: 10px 20px; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 1em; box-shadow: 0 4px 10px rgba(230, 57, 70, 0.4); transition: 0.2s;">⚡ Desbloquear PS4</a>
        </div>
        
        <h1>Zer0 Loja PS4</h1>
        <p class="subtitle">A sua biblioteca de jogos desbloqueada</p>
    </header>

    <div class="search-container">
        <input type="text" id="busca" class="search-input" placeholder="Digite o nome do jogo para buscar...">
        
        <!-- NOVOS BOTÕES DE FILTRO -->
        <div class="filtros-container">
            <button class="filtro-btn active" data-filtro="todos">Tudo</button>
            <button class="filtro-btn" data-filtro="jogos">🎮 Jogos</button>
            <button class="filtro-btn" data-filtro="apps">⚙️ Ferramentas</button>
        </div>
    </div>

    <div id="loading">Carregando catálogo...</div>

    <!-- Área de Jogos -->
    <h2 class="section-title" id="titulo-jogos" style="display: none; width: 100%; text-align: left; max-width: 1300px; margin-bottom: 15px; color: var(--ps-blue);">🎮 Jogos</h2>
    <div class="loja-container" id="lista-jogos"></div>

    <!-- Área de Ferramentas e Apps -->
    <h2 class="section-title" id="titulo-apps" style="display: none; width: 100%; text-align: left; max-width: 1300px; margin-bottom: 15px; color: var(--ps-blue);">⚙️ Ferramentas do Sistema</h2>
    <div class="loja-container" id="lista-apps" style="margin-bottom: 40px;"></div>

    <!-- Script global (só funções utilitárias) -->
    <script src="script.js"></script>
    <!-- Script específico da loja -->
    <script src="loja.js"></script>

</body>
</html>
